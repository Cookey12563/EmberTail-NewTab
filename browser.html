<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ember Tail Browser</title>
  <link rel="icon" type="image/png" href="EMBERTAILFAV.PNG">
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
  >

  <style>
    :root {
      color-scheme: dark;
      --background: #17191b;
      --panel: #2d3033;
      --input: #202225;
      --cream: #fff3df;
      --muted: #c7beb1;
      --orange: #e77a32;
      --gold: #f5c95f;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--background);
      color: var(--cream);
      font-family: "Open Sans", Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .outside {
      border: 1px solid #ffffff20;
      border-radius: 9px;
      padding: 8px 11px;
      background: var(--input);
      color: var(--cream);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }

    button:hover,
    .outside:hover {
      background: #414549;
    }

    button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .chrome {
      flex-shrink: 0;
      background: var(--panel);
      border-bottom: 2px solid var(--orange);
    }

    .tab-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 10px 0;
    }

    .tabs {
      display: flex;
      flex: 1;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      padding: 2px;
    }

    .tab {
      display: flex;
      align-items: center;
      flex: 0 0 190px;
      min-width: 0;
      border: 1px solid #ffffff20;
      border-radius: 12px 12px 0 0;
      background: var(--input);
    }

    .tab.active {
      border-color: var(--orange);
      background: #414549;
    }

    .tab-select {
      flex: 1;
      overflow: hidden;
      padding: 10px;
      border: 0;
      background: transparent;
      text-align: left;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .tab-close {
      margin-right: 4px;
      padding: 4px 8px;
      border: 0;
      background: transparent;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px;
    }

    .address-form {
      display: flex;
      flex: 1;
      min-width: 0;
    }

    .address {
      width: 100%;
      min-width: 0;
      padding: 9px 13px;
      border: 1px solid #ffffff35;
      border-radius: 999px;
      background: var(--background);
      color: var(--cream);
      font-size: 13px;
    }

    .address::placeholder {
      color: #a9a9ad;
    }

    .address:focus::placeholder {
      color: transparent;
    }

    .star {
      padding: 5px 10px;
      font-size: 23px;
      line-height: 1.25;
      color: var(--gold);
    }

    .bookmarks {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding: 0 10px 8px;
    }

    .bookmarks:empty {
      display: none;
    }

    .bookmark {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--input);
    }

    .bookmark-open,
    .bookmark-delete {
      border: 0;
      background: transparent;
      font-size: 12px;
    }

    .bookmark-open {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bookmark-delete {
      padding: 5px 7px;
      color: var(--muted);
    }

    .views {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .view {
      width: 100%;
      height: 100%;
    }

    .page-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--background);
    }

    .closed-page {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 24px;
      overflow: auto;
      text-align: center;
    }

    @media (max-width: 600px) {
      .tab {
        flex-basis: 150px;
      }

      .toolbar {
        gap: 4px;
        padding: 8px;
      }

      .toolbar > button {
        padding: 7px;
      }

      .outside {
        padding: 7px;
        font-size: 11px;
      }

      .address {
        font-size: 12px;
        padding: 9px;
      }
    }
  </style>
</head>

<body>
  <header id="chrome" class="chrome">
    <div class="tab-row">
      <div id="tabs" class="tabs" aria-label="Open tabs"></div>

      <button
        id="new-tab"
        type="button"
        aria-label="New tab"
      >＋</button>
    </div>

    <div class="toolbar">
      <button
        id="back"
        type="button"
        aria-label="Back"
        title="Back"
      >←</button>

      <button
        id="forward"
        type="button"
        aria-label="Forward"
        title="Forward"
      >→</button>

      <button
        id="reload"
        type="button"
        aria-label="Reload"
        title="Reload"
      >↻</button>

      <button
        id="home"
        type="button"
        aria-label="Home"
        title="Home"
      >🏠</button>

      <form id="address-form" class="address-form">
        <input
          id="address"
          class="address"
          type="text"
          aria-label="Search Ember Tail or type a URL"
          placeholder="Search Ember Tail or type a URL"
          autocomplete="off"
          spellcheck="false"
          required
        >
      </form>

      <button
        id="add-bookmark"
        class="star"
        type="button"
        aria-label="Bookmark this page"
        title="Bookmark this page"
      >☆</button>

      <a
        id="outside"
        class="outside"
        target="_blank"
        rel="noopener noreferrer"
      >Open outside ↗</a>
    </div>

    <nav
      id="bookmarks"
      class="bookmarks"
      aria-label="Bookmarks"
    ></nav>
  </header>

  <main
    id="views"
    class="views"
    aria-label="Page viewport"
  ></main>

  <script>
    (() => {
      const homeURL = new URL("index.html", location.href).href;
      const searchURL = new URL("results.html", location.href).href;
      const projectURL = new URL(".", homeURL);
      const bookmarkKey = "embertail-browser-bookmarks";

      const tabBar = document.getElementById("tabs");
      const views = document.getElementById("views");
      const address = document.getElementById("address");
      const back = document.getElementById("back");
      const forward = document.getElementById("forward");
      const outside = document.getElementById("outside");
      const star = document.getElementById("add-bookmark");
      const bookmarkBar = document.getElementById("bookmarks");

      const tabs = [];
      let activeId = null;
      let nextId = 0;
      let bookmarks = [];

      function safeURL(value) {
        try {
          const url = new URL(value);

          if (["https:", "http:"].includes(url.protocol)) {
            return url.href;
          }

          if (
            location.protocol === "file:" &&
            url.protocol === "file:"
          ) {
            return url.href;
          }
        } catch {}

        return null;
      }

      function isHome(value) {
        try {
          const url = new URL(value);
          const home = new URL(homeURL);

          return (
            url.origin === home.origin &&
            url.pathname === home.pathname &&
            url.search === ""
          );
        } catch {
          return false;
        }
      }

      function isProjectPage(value) {
        try {
          const url = new URL(value);

          return (
            url.protocol === projectURL.protocol &&
            url.host === projectURL.host &&
            url.pathname.startsWith(projectURL.pathname) &&
            !url.pathname.endsWith("/browser.html")
          );
        } catch {
          return false;
        }
      }

      function titleFor(value) {
        if (isHome(value)) return "Ember Tail";

        try {
          const url = new URL(value);

          if (
            isProjectPage(value) &&
            url.pathname.endsWith("/results.html")
          ) {
            const query = url.searchParams.get("q");
            return query ? `${query} - Ember Tail` : "Ember Tail";
          }

          return url.hostname || "Local page";
        } catch {
          return "Page";
        }
      }

      function activeTab() {
        return tabs.find(tab => tab.id === activeId);
      }

      function currentURL(tab) {
        return tab.history[tab.position];
      }

      function bookmarkIndex(url) {
        return bookmarks.findIndex(bookmark => bookmark.url === url);
      }

      function refreshToolbar() {
        const tab = activeTab();
        if (!tab) return;

        const url = currentURL(tab);

        address.value = isHome(url) ? "" : url;
        outside.href = url;
        back.disabled = tab.position === 0;
        forward.disabled = tab.position === tab.history.length - 1;

        const saved = bookmarkIndex(url) >= 0;

        star.textContent = saved ? "★" : "☆";
        star.title = saved ? "Remove bookmark" : "Bookmark this page";
        star.setAttribute("aria-label", star.title);
        star.setAttribute("aria-pressed", String(saved));

        document.title = `${tab.title} - Ember Tail Browser`;
      }

      function renderTabs() {
        tabBar.replaceChildren();

        for (const tab of tabs) {
          const wrapper = document.createElement("div");

          wrapper.className =
            "tab" + (tab.id === activeId ? " active" : "");

          const select = document.createElement("button");
          select.type = "button";
          select.className = "tab-select";
          select.textContent = tab.title;
          select.title = tab.title;

          select.setAttribute(
            "aria-pressed",
            String(tab.id === activeId)
          );

          select.onclick = () => selectTab(tab.id);

          const close = document.createElement("button");
          close.type = "button";
          close.className = "tab-close";
          close.textContent = "×";
          close.setAttribute("aria-label", `Close ${tab.title}`);
          close.onclick = () => closeTab(tab.id);

          wrapper.append(select, close);
          tabBar.append(wrapper);
        }
      }

      function selectTab(id) {
        activeId = id;

        for (const tab of tabs) {
          tab.view.hidden = tab.id !== id;
        }

        renderTabs();
        refreshToolbar();
      }

      function recordVisit(tab, url) {
        if (url === currentURL(tab)) return;

        tab.history = tab.history.slice(0, tab.position + 1);
        tab.history.push(url);
        tab.position = tab.history.length - 1;
      }

      function interceptProjectLinks(tab, frame) {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;

          doc.addEventListener("click", event => {
            if (event.defaultPrevented || event.button !== 0) return;

            const link = event.target.closest?.("a[href]");

            if (!link || link.hasAttribute("download")) return;

            const url = safeURL(link.href);
            if (!url) return;

            event.preventDefault();

            if (
              event.ctrlKey ||
              event.metaKey ||
              event.shiftKey ||
              link.target === "_blank"
            ) {
              createTab(url);
            } else {
              navigate(tab, url);
            }
          });
        } catch {}
      }

      function displayPage(tab) {
        const url = currentURL(tab);

        tab.title = titleFor(url);
        tab.view.replaceChildren();

        const frame = document.createElement("iframe");
        frame.className = "page-frame";
        frame.title = `Page: ${tab.title}`;
        frame.referrerPolicy = "strict-origin-when-cross-origin";

        frame.setAttribute(
          "sandbox",
          "allow-scripts allow-same-origin allow-forms " +
          "allow-popups allow-popups-to-escape-sandbox allow-downloads"
        );

        tab.frame = frame;

        frame.addEventListener("load", () => {
          if (!tabs.includes(tab) || tab.frame !== frame) return;

          try {
            const loaded = safeURL(frame.contentWindow.location.href);

            if (loaded && loaded !== "about:blank") {
              recordVisit(tab, loaded);

              tab.title =
                frame.contentDocument.title || titleFor(loaded);

              if (isProjectPage(loaded)) {
                interceptProjectLinks(tab, frame);
              }
            }
          } catch {
            // Cross-origin pages cannot be inspected.
          }

          renderTabs();

          if (tab.id === activeId) {
            refreshToolbar();
          }
        });

        tab.view.append(frame);
        frame.src = url;

        renderTabs();

        if (tab.id === activeId) {
          refreshToolbar();
        }
      }

      function navigate(tab, url) {
        const destination = safeURL(url);

        if (!tab || !destination) return;

        recordVisit(tab, destination);
        displayPage(tab);
      }

      function createTab(url = homeURL) {
        const destination = safeURL(url);
        if (!destination) return;

        const view = document.createElement("div");
        view.className = "view";

        const tab = {
          id: ++nextId,
          title: titleFor(destination),
          history: [destination],
          position: 0,
          view,
          frame: null
        };

        tabs.push(tab);
        views.append(view);

        selectTab(tab.id);
        displayPage(tab);
      }

      function closeTab(id) {
        const index = tabs.findIndex(tab => tab.id === id);
        if (index < 0) return;

        if (tabs.length === 1) {
          tabs[0].view.remove();
          tabs.splice(0);
          activeId = null;

          document.getElementById("chrome").hidden = true;
          document.title = "Ember Tail closed";

          const page = document.createElement("section");
          page.className = "closed-page";

          const message = document.createElement("div");

          const heading = document.createElement("h1");
          heading.textContent = "Ember Tail closed";

          const note = document.createElement("p");
          note.textContent =
            "If this window stayed open, close it using your browser.";

          message.append(heading, note);
          page.append(message);
          views.replaceChildren(page);

          window.close();
          return;
        }

        const wasActive = id === activeId;

        tabs[index].view.remove();
        tabs.splice(index, 1);

        if (wasActive) {
          selectTab(tabs[Math.min(index, tabs.length - 1)].id);
        } else {
          renderTabs();
        }
      }

      function travel(direction) {
        const tab = activeTab();
        if (!tab) return;

        const next = tab.position + direction;

        if (next < 0 || next >= tab.history.length) return;

        tab.position = next;
        displayPage(tab);
      }

      function resolveAddress(value) {
        const text = value.trim();
        if (!text) return null;

        if (
          /^https?:\/\//i.test(text) ||
          /^file:\/\//i.test(text)
        ) {
          return safeURL(text);
        }

        if (
          !/\s/.test(text) &&
          /^(localhost(?::\d+)?|(?:[a-z0-9-]+\.)+[a-z]{2,})(?:[/:?#]|$)/i
            .test(text)
        ) {
          const protocol =
            /^localhost(?::|\/|$)/i.test(text) ? "http" : "https";

          return safeURL(`${protocol}://${text}`);
        }

        const destination = new URL(searchURL);
        destination.searchParams.set("q", text);

        return destination.href;
      }

      try {
        const saved = JSON.parse(localStorage.getItem(bookmarkKey));

        if (Array.isArray(saved)) {
          bookmarks = saved
            .filter(item =>
              item &&
              typeof item.name === "string" &&
              typeof item.url === "string" &&
              safeURL(item.url)
            )
            .map(item => ({
              name: item.name.slice(0, 100),
              url: safeURL(item.url)
            }));
        }
      } catch {}

      function saveBookmarks() {
        try {
          localStorage.setItem(
            bookmarkKey,
            JSON.stringify(bookmarks)
          );
        } catch {}
      }

      function renderBookmarks() {
        bookmarkBar.replaceChildren();

        bookmarks.forEach((bookmark, index) => {
          const wrapper = document.createElement("div");
          wrapper.className = "bookmark";

          const open = document.createElement("button");
          open.type = "button";
          open.className = "bookmark-open";
          open.textContent = bookmark.name;
          open.title = bookmark.url;

          open.onclick = () => {
            navigate(activeTab(), bookmark.url);
          };

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "bookmark-delete";
          remove.textContent = "×";

          remove.setAttribute(
            "aria-label",
            `Remove bookmark ${bookmark.name}`
          );

          remove.onclick = () => {
            bookmarks.splice(index, 1);
            renderBookmarks();
            saveBookmarks();
            refreshToolbar();
          };

          wrapper.append(open, remove);
          bookmarkBar.append(wrapper);
        });
      }

      document.getElementById("address-form")
        .addEventListener("submit", event => {
          event.preventDefault();

          const destination = resolveAddress(address.value);

          if (destination) {
            navigate(activeTab(), destination);
          }
        });

      document.getElementById("new-tab").onclick = () => {
        createTab();
      };

      back.onclick = () => travel(-1);
      forward.onclick = () => travel(1);

      document.getElementById("reload").onclick = () => {
        const tab = activeTab();
        if (!tab) return;

        if (tab.frame) {
          try {
            tab.frame.contentWindow.location.reload();
          } catch {
            displayPage(tab);
          }
        } else {
          displayPage(tab);
        }
      };

      document.getElementById("home").onclick = () => {
        navigate(activeTab(), homeURL);
      };

      star.onclick = () => {
        const tab = activeTab();
        if (!tab) return;

        const url = currentURL(tab);
        const index = bookmarkIndex(url);

        if (index >= 0) {
          bookmarks.splice(index, 1);
        } else {
          const name = prompt("Bookmark name:", tab.title);

          if (name === null || !name.trim()) return;

          bookmarks.push({
            name: name.trim().slice(0, 100),
            url
          });
        }

        renderBookmarks();
        saveBookmarks();
        refreshToolbar();
      };

      renderBookmarks();
      createTab();
    })();
  </script>
</body>
</html>
