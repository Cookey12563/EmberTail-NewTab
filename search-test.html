<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmberTail Search — Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Comic Sans MS", system-ui, sans-serif;
      color: #fff3df;
      background: #17191b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #e77a3224, transparent 55%),
        radial-gradient(circle at bottom right, #516b4533, transparent 55%);
    }

    main {
      width: min(850px, 100%);
      margin: auto;
      padding: 65px 22px;
    }

    h1 {
      color: #ffab5c;
      font-size: clamp(38px, 8vw, 64px);
      margin: 0 0 8px;
    }

    .intro, #status {
      color: #c7beb1;
      line-height: 1.6;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 28px 0;
    }

    input, button {
      font: inherit;
      border: 2px solid #ffab5c;
      border-radius: 14px;
      padding: 14px;
    }

    input {
      flex: 1;
      min-width: 0;
      color: #fff3df;
      background: #202225;
    }

    button {
      background: #ffab5c;
      color: #27211c;
      cursor: pointer;
    }

    :focus-visible {
      outline: 3px solid #f5c95f;
      outline-offset: 4px;
    }

    article {
      background: #2d3033;
      border: 1px solid #ffab5c55;
      border-radius: 18px;
      padding: 22px;
      margin: 16px 0;
    }

    article h2 { margin: 6px 0 10px; font-size: 23px; }
    article a { color: #ffab5c; }
    article p { margin: 0; line-height: 1.7; }
    .url { color: #c7beb1; overflow-wrap: anywhere; font-size: 13px; }
    mark { background: #f5c95f; color: #17191b; border-radius: 3px; }

    @media (max-width: 450px) {
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>🦊 EmberTail</h1>
    <p class="intro">
      A little independent search experiment.<br>
      Searches our starter collection—not the entire web.
    </p>

    <form id="search" role="search">
      <input
        id="query"
        type="search"
        aria-label="Search the EmberTail collection"
        placeholder="Try videos, documents, or maps…"
        maxlength="200"
        required
      >
      <button type="submit">Search ➜</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" aria-label="Search results"></section>
  </main>

  <script>
    // Hand-written starter records, not crawled page content.
    // Add more objects here to expand the searchable collection.
    const pages = [
      {
        title: "YouTube",
        url: "https://www.youtube.com/",
        description: "A starter shortcut for finding and watching videos.",
        keywords: "videos music watch creators entertainment"
      },
      {
        title: "Google Docs",
        url: "https://docs.google.com/",
        description: "A starter shortcut for working with documents.",
        keywords: "documents writing essays school text"
      },
      {
        title: "Google Drive",
        url: "https://drive.google.com/",
        description: "A starter shortcut for your files and folders.",
        keywords: "files folders storage documents"
      },
      {
        title: "Google Maps",
        url: "https://maps.google.com/",
        description: "A starter shortcut for maps and places.",
        keywords: "maps places directions travel location"
      },
      {
        title: "Google Calendar",
        url: "https://calendar.google.com/",
        description: "A starter shortcut for your calendar.",
        keywords: "calendar dates events schedule planning"
      },
      {
        title: "Google Translate",
        url: "https://translate.google.com/",
        description: "A starter shortcut for translation.",
        keywords: "translate translation languages words"
      },
      {
        title: "Gmail",
        url: "https://mail.google.com/",
        description: "A starter shortcut for email.",
        keywords: "email mail messages inbox"
      },
      {
        title: "EmberTail New Tab",
        url: "https://cookey12563.github.io/EmberTail-NewTab/",
        description: "The EmberTail home page that started this experiment.",
        keywords: "embertail ember tail fox new tab search home"
      }
    ];

    const form = document.getElementById("search");
    const input = document.getElementById("query");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    function words(text) {
      return text.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
    }

    // This local function is our first search layer.
    // Later, its job could move to a separately hosted API.
    async function searchIndex(query) {
      const terms = [...new Set(words(query))];
      if (!terms.length) return [];

      return pages.map(page => {
        const title = new Set(words(page.title));
        const description = new Set(words(page.description));
        const keywords = new Set(words(page.keywords));

        let score = 0;
        let matches = 0;

        for (const term of terms) {
          const matched =
            title.has(term) ||
            description.has(term) ||
            keywords.has(term);

          if (matched) matches++;
          if (title.has(term)) score += 8;
          if (keywords.has(term)) score += 4;
          if (description.has(term)) score += 2;
        }

        if (matches === terms.length) score += 10;

        return { ...page, score, matches };
      })
      .filter(page => page.matches > 0)
      .sort((a, b) => b.score - a.score);
    }

    // Build highlighted text without inserting HTML from the query.
    function highlight(text, terms) {
      const fragment = document.createDocumentFragment();
      const pieces = text.split(/([\p{L}\p{N}]+)/gu);

      for (const piece of pieces) {
        if (terms.has(piece.toLowerCase())) {
          const mark = document.createElement("mark");
          mark.textContent = piece;
          fragment.append(mark);
        } else {
          fragment.append(document.createTextNode(piece));
        }
      }

      return fragment;
    }

    async function runSearch(query) {
      const found = await searchIndex(query);
      const terms = new Set(words(query));
      results.replaceChildren();

      status.textContent = found.length
        ? `${found.length} result${found.length === 1 ? "" : "s"} for “${query}” in our ${pages.length}-page starter collection.`
        : `No matches for “${query}” in our starter collection. Try videos, documents, maps, or fox.`;

      for (const page of found) {
        const article = document.createElement("article");
        const address = document.createElement("div");
        const heading = document.createElement("h2");
        const link = document.createElement("a");
        const description = document.createElement("p");

        address.className = "url";
        address.textContent = page.url;

        link.href = page.url;
        link.append(highlight(page.title, terms));

        description.append(highlight(page.description, terms));
        heading.append(link);
        article.append(address, heading, description);
        results.append(article);
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const query = input.value.trim();

      if (!words(query).length) {
        status.textContent = "Enter a word or phrase to search.";
        results.replaceChildren();
        input.focus();
        return;
      }

      const url = new URL(location.href);
      url.searchParams.set("q", query);
      history.replaceState(null, "", url);
      runSearch(query);
    });

    const initialQuery = new URLSearchParams(location.search).get("q");
    if (initialQuery) {
      input.value = initialQuery.slice(0, 200);
      runSearch(input.value);
    } else {
      status.textContent = `${pages.length} starter pages ready to search.`;
    }
  </script>
</body>
</html>
